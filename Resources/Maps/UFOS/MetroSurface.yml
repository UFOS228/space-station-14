- proto: Paper
  entities:
  - uid: 648
    components:
    - type: Transform
      parent: 647
    - type: Paper
      content: >-
        День 1.

        Сегодня я отправлюсь в новый мир, где ядерная зима и апокалипсис уничтожили почти всё живое. Я решил стать сталкером и искать ресурсы для выживания. Первым делом я отправился на поверхность, чтобы найти еду и воду. К сожалению, город был разрушен, но мне удалось найти немного консервов и бутылку воды.

        День 2.

        Я продолжил своё путешествие и наткнулся на заброшенную военную базу. Там я нашёл оружие, боеприпасы и медикаменты. Это значительно увеличило мои шансы на выживание. Также я обнаружил старый радиопередатчик, который мог использоваться для связи с другими выжившими.

        День 3.

        Сегодня я решил отправиться в глубь города, чтобы найти еды и возможно других выживших. В городе я столкнулся с мутантами, но благодаря своему оружию и опыту смог их победить. Готовлюсь к экспидиции на склад, после всего этого вернусь на свою родную станцию.
    - type: Physics
      canCollide: False
